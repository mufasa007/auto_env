name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # NOTE: macOS build is intentionally disabled until a Developer ID Application
  # certificate is provisioned and the corresponding MACOS_* secrets are
  # configured. The full signed+notarized job definition is preserved in git
  # history (commit 6c90248) and can be restored verbatim when ready. See
  # docs/RELEASE.md for the macOS pre-flight checklist.

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name="${{ steps.version.outputs.version }}" `
            --build-number="$env:GITHUB_RUN_NUMBER"

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "auto_env-$version-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_env-windows
          path: auto_env-*-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/auto_env-*-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
